[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app.py", "chalicelib", "infra/stacks"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# chalice/__init__.py reexporta as classes sem __all__
[[tool.mypy.overrides]]
module = ["chalice"]
implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
